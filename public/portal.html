<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomad Platform</title><style>body{font-family:system-ui;margin:0;background:#f5f2eb;color:#111}.top{background:#111;color:#fff;padding:22px 6%;display:flex;justify-content:space-between}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #ddd;margin-top:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.active{background:#111;color:#fff}input{display:block;width:100%;padding:12px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #ccc;border-radius:9px}.primary{background:#111;color:#fff}.error{color:#a00}</style></head><body><header class="top"><b>Ahmed Nomad Bikes</b><a href="/" style="color:white">Home</a></header><main class="wrap"><h1>Nomad Platform</h1><p>Secure accounts for customers, riders and authorised administration.</p><div class="tabs"><button id="c" class="active" onclick="setRole('CUSTOMER')">Customer</button><button id="r" onclick="setRole('RIDER')">Rider</button><button id="a" onclick="setRole('ADMIN')">Admin</button></div><section class="card"><h2 id="title">Customer sign in</h2><form id="form"><label>Name (registration only)<input id="name"></label><label>Phone or email<input id="login" required></label><label>Password<input id="password" type="password" required></label><button class="primary" type="submit">Sign in</button></form><p id="switch">New customer? <button onclick="register=true;render()">Create account</button></p><p id="msg"></p></section></main><script>let role='CUSTOMER',register=false;function setRole(x){role=x;register=false;render()}function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(role==='CUSTOMER'?'c':role==='RIDER'?'r':'a').classList.add('active');document.getElementById('title').textContent=register?'Create '+role.toLowerCase()+' account':role[0]+role.slice(1).toLowerCase()+' sign in';document.getElementById('switch').innerHTML=register?'Already registered? <button onclick="register=false;render()">Sign in</button>':(role==='ADMIN'?'Admin accounts are created privately by Nomad.':'New '+role.toLowerCase()+'? <button onclick="register=true;render()">Create account</button>');document.getElementById('name').parentElement.style.display=register?'block':'none';document.getElementById('form').querySelector('button').textContent=register?'Create account':'Sign in'}document.getElementById('form').onsubmit=async e=>{e.preventDefault();let p={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(register?{name:name.value,phone:login.value,email:'',password:password.value,role}:{login:login.value,password:password.value})};let endpoint=register?'auth-register':'auth-login';try{let r=await fetch('/.netlify/functions/'+endpoint,p),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');if(register){msg.textContent=role==='RIDER'?'Rider account created. Admin approval is required.':'Account created. Sign in now.';register=false;render()}else{localStorage.setItem('nomad-session',d.token);location.href='/portal.html'}}catch(x){msg.innerHTML='<span class="error">'+x.message+'</span>'}};render()</script></body></html>
